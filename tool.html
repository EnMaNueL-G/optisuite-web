<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herramienta — OptiSuite Office</title>
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .tpage{max-width:760px;margin:0 auto;padding:32px 20px 64px;}
    .tback{display:inline-flex;align-items:center;gap:6px;color:#7C3AED;text-decoration:none;font-size:0.9rem;font-weight:600;margin-bottom:24px;}
    .thead{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
    .temoji{font-size:3rem;line-height:1;}
    .tchip{font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:6px;}
    .tdesc{font-size:1.05rem;line-height:1.6;color:var(--text,#222);margin:8px 0 28px;}
    .tsec{margin-bottom:26px;}
    .tsec h2{font-size:1.05rem;margin-bottom:12px;}
    .tlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;}
    .tlist li{display:flex;align-items:flex-start;gap:10px;font-size:0.95rem;line-height:1.45;}
    .tlist li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;margin-top:7px;background:linear-gradient(135deg,#7C3AED,#06B6D4);}
    .tcta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;}
    .tbtn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;
      text-decoration:none;font-weight:600;font-size:0.92rem;}
    .tbtn.primary{background:linear-gradient(135deg,#7C3AED,#06B6D4);color:#fff;}
    .tbtn.ghost{border:1px solid var(--border,#ddd);color:var(--text,#333);}
    .tnote{margin-top:18px;font-size:0.82rem;color:var(--text-muted,#777);}
  </style>
</head>
<body>
  <div class="tpage">
    <a class="tback" href="index.html#office-tools">← Todas las herramientas</a>
    <div id="tool-root"><p>Cargando…</p></div>
  </div>

  <script src="assets/js/tools-data.js"></script>
  <script>
    (function(){
      function qs(k){return new URLSearchParams(location.search).get(k);}
      function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
      var id=qs('t');
      var t=(window.OPTI_TOOLS||[]).find(function(x){return x.id===id;});
      var root=document.getElementById('tool-root');
      if(!t){
        root.innerHTML='<h1>Herramienta no encontrada</h1><p>Vuelve a <a href="index.html#office-tools">la lista de herramientas</a>.</p>';
        return;
      }
      document.title=t.name+' — OptiSuite Office';
      var tierColor = t.tier==='Gratis' ? ['#43A04722','#2e7d32']
                    : t.tier==='PRO+'   ? ['#7C3AED22','#7C3AED']
                    :                     ['#6B21A822','#6B21A8'];
      function chip(text,bg,fg){return '<span class="tchip" style="background:'+bg+';color:'+fg+';">'+esc(text)+'</span>';}
      function list(arr){return '<ul class="tlist">'+arr.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';}

      var isPlus = t.tier==='PRO+';
      var apk = isPlus ? 'assets/OptiSuiteOfficePROplus-v1.0.1.apk' : 'assets/OptiSuiteOfficePro-v1.0.0.apk';
      var buy = isPlus ? 'https://optisuite.gumroad.com/l/oisvav' : 'https://optisuite.gumroad.com/l/ggkurh';
      var product = isPlus ? 'OptiSuite Office PRO+' : (t.tier==='Gratis' ? 'OptiSuite Office PRO (gratis, sin licencia)' : 'OptiSuite Office PRO');

      root.innerHTML =
        '<div class="thead"><div class="temoji">'+t.emoji+'</div>'+
          '<div><h1 style="margin:0 0 8px;">'+esc(t.name)+'</h1>'+
          '<div style="display:flex;gap:8px;">'+chip(t.cat,'#00000010','#555')+chip(t.tier,tierColor[0],tierColor[1])+'</div></div></div>'+
        '<p class="tdesc">'+esc(t.desc)+'</p>'+
        '<div class="tsec"><h2>Funciones</h2>'+list(t.functions)+'</div>'+
        '<div class="tsec"><h2>Especificaciones técnicas</h2>'+list(t.specs)+'</div>'+
        '<p class="tnote">Disponible en: <strong>'+esc(product)+'</strong>. Procesamiento 100% local, sin anuncios ni telemetría.</p>'+
        '<div class="tcta">'+
          '<a class="tbtn primary" href="'+apk+'">⬇ Descargar APK</a>'+
          '<a class="tbtn ghost" href="'+buy+'" target="_blank" rel="noopener">Comprar licencia</a>'+
        '</div>';
    })();
  </script>
</body>
</html>
